<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280">
  <rect x="0" y="0" width="700" height="280" fill="#ffffff" />

  <!-- pipes -->
  <path id="pipe-1" data-from="input" data-to="connection-1" d="M120 140 L260 140" stroke="#9ca3af" stroke-width="4" fill="none" />
  <path id="pipe-2" data-from="connection-1" data-to="tank-T1" d="M260 140 L380 140" stroke="#9ca3af" stroke-width="4" fill="none" />
  <path id="pipe-3" data-from="tank-T1" data-to="outlet" d="M470 140 L580 140" stroke="#9ca3af" stroke-width="4" fill="none" />

  <!-- valves -->
  <circle id="valve-1" data-pipe="pipe-1" cx="190" cy="140" r="14" fill="#dc2626" />
  <text x="190" y="145" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">1</text>
  <circle id="valve-2" data-pipe="pipe-2" cx="320" cy="140" r="14" fill="#dc2626" />
  <text x="320" y="145" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">2</text>

  <!-- input -->
  <rect id="input" x="40" y="115" width="60" height="50" rx="4" fill="#6b7280" stroke="#9ca3af" stroke-width="3" />
  <text x="70" y="142" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">供給</text>

  <!-- connection -->
  <circle id="connection-1" cx="260" cy="140" r="5" fill="#9ca3af" />

  <!-- tank -->
  <rect id="tank-T1" data-tank-id="1" x="400" y="118" width="55" height="45" rx="4" fill="#6b7280" stroke="#9ca3af" stroke-width="3" />
  <text x="428" y="142" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">T-1</text>

  <!-- outlet -->
  <rect id="outlet" x="600" y="120" width="50" height="40" rx="4" fill="#6b7280" stroke="#9ca3af" stroke-width="3" />
  <text x="625" y="143" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">出口</text>
</svg>
